<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161414'/%3E%3Ctext x='16' y='23' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='800' fill='%23d81f26' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<!-- ═══════════════════════════════════════════════════════════════════════
     TURMA DE HOJE (13/09/2026): o lado do professor no Planner Digital.

     A decisão 14 do Pedro: uma página com a aula do planner em que cada um
     dos alunos da turma está, no celular também, ticando. Esta é a versão
     mínima: a turma vinda do card (cascata escola → professor → turma, a
     mesma do Planejador), cada aluno na lição e aula em que o card o coloca,
     as três metades do planner (o que o aluno marcou, o que a plataforma
     provou, o que o professor confirmou) e o registro do Checking em poucos
     toques: o critério em que foi melhor, os que precisam melhorar, a nota
     (só o professor vê), os pedidos e um bilhete.

     O GABARITO NÃO MORA AQUI. O plano do Essentials 1 e a régua das marcas
     (`estadoEtapa`, a mesma que desenha a lição para o aluno) vêm do Portal
     do Aluno, carregados de portalfisk.com.br: o professor enxerga exatamente
     o que o aluno enxerga, e uma régua só não discorda dela mesma. Livro sem
     gabarito v2 ainda (todos menos o Essentials 1) mostra só a posição e o
     registro do Checking.

     O que ESCREVE: a rota `plannerProf` (token da sessão do Hub; o `quem` do
     registro sai da sessão no servidor, nunca daqui). O que LÊ: `plannerTurma`
     (a turma inteira numa leitura por aba) e `panoramaProf` (os alunos da
     turma com RAF, vindos do card).
     ═══════════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="assets/turma-de-hoje.css?v=70d055a149">
</head>
<body>
<script>try{if(localStorage.getItem("fisk_theme")==="dark")document.body.classList.add("theme-dark");}catch(e){}</script>

<header class="hero">
  <a class="back-link" href="index.html" title="Voltar ao Fisk Hub">&larr; Hub</a>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar modo escuro" title="Alternar modo escuro">🌙</button>
  <img class="hero-logo" src="assets/fisk-logo.png" alt="FISK Taubaté · Caçapava">
  <h1>Minha aula</h1>
</header>

<main>
  <div class="painel">
    <div class="cascata">
      <div><label for="selEscola">Escola</label><select id="selEscola" disabled><option value="" disabled selected>Carregando…</option></select></div>
      <div><label for="selProf">Professor(a)</label><select id="selProf" disabled><option value="" disabled selected>Professor(a)…</option></select></div>
      <div><label for="selTurma">Turma</label><select id="selTurma" disabled><option value="" disabled selected>Turma…</option></select></div>
    </div>
    <div class="status" id="status">Escolha a turma. Os alunos e a posição de cada um vêm do card.</div>
    <!-- outro aluno (Pedro, 15/09/2026): turmas juntadas por falta; o aluno buscado entra embaixo, sem tirar os da turma -->
    <div class="busca-al">
      <label for="qAluno">🔎 Trazer outro aluno</label>
      <input id="qAluno" type="search" autocomplete="off" placeholder="Nome completo ou RAF de qualquer aluno da escola">
      <div id="achadosAluno" class="achados-al" hidden></div>
    </div>
    <div class="legenda" id="legenda" hidden>
      <details class="leg-det"><summary>? Legenda das marcas</summary><div class="leg-itens"><span><i class="mk l-a" style="width:18px;height:18px;border-width:2px"></i> o aluno marcou</span>
      <span><i class="mk r-prof" style="width:18px;height:18px;border-width:2px"></i> você confirmou</span>
      <span><i class="mk cheia-prof" style="width:18px;height:18px;border-width:2px"></i> o professor marcou</span>
      <span><i class="mk quad plat" style="width:18px;height:18px;border-width:2px;border-radius:5px"></i> o portal comprovou</span>
      <span><i class="mk tri" style="width:18px;height:16px"></i> tarefa: só o aluno marca</span></div></details>
      <button type="button" class="obs-toggle" id="obsToggle">🙈 Esconder as anotações (tela na TV)</button>
    </div>
  </div>
  <div id="fila-off" class="fila-off" hidden></div>
  <div id="resumo" class="resumo" style="max-width:1500px;margin:0 auto .6rem" hidden></div>
  <div id="fila" class="fila-info" hidden></div>
  <div id="plano-turma" class="pt" hidden></div>
  <div id="alunos"></div>
</main>

<!-- O gabarito e a régua vêm do Portal do Aluno: uma fonte só -->
<script src="https://portalfisk.com.br/assets/avatar-festa.js?v=2026-10-26c"></script>
<!-- as capas redondas dos livros (FiskCapas), servidas pelo portal: a mesma tabela do aluno, da secretaria e da direção -->
<script src="https://portalfisk.com.br/assets/capas.js?v=1"></script>
<script src="https://portalfisk.com.br/assets/planner-v2.js?v=f9e5851b94"></script><!-- ?v= = md5 do assets/planner-v2.js do portal-aluno-fisk (o mesmo do index.html do portal), conferido em 31/10/2026 -->
<!-- o guia do Checking, lição a lição: a base comum e um arquivo por livro (Essentials, Transitions e Fluency 1 e 2, In Focus, Inmediato 1 a 3) -->
<script src="https://portalfisk.com.br/assets/checking/guia-base.js?v=5a600e1933"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-e1.js?v=9630e2ddde"></script>

<script src="https://portalfisk.com.br/assets/checking/guia-t1.js?v=e9a53aa8f8"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-t2.js?v=9f51eeedb5"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-f1.js?v=168dda2a8e"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-f2.js?v=793d94a10f"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-if.js?v=bf2cd2ef09"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-i1.js?v=551896a136"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-i2.js?v=56bd0516a9"></script>
<script src="https://portalfisk.com.br/assets/checking/guia-i3.js?v=e326479afd"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="assets/fisk-shared.js?v=d3ccf11e34"></script>
<script src="assets/fisk-pre-aula.js?v=43e6e651bf"></script>
<script src="assets/turma-de-hoje.js?v=651e6ed16e"></script>
</body>
</html>
